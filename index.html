<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.S.C. | AI-Assisted Mentor Evaluation System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(18, 26, 44, 0.8);
      --border-card: rgba(255, 255, 255, 0.1);
      --primary-accent: #7c3aed;
      --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%);
      --secondary-accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.2) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.18) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    header {
      border-bottom: 1px solid var(--border-card);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 13, 22, 0.85);
    }

    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary-gradient);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tag {
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 20px;
      background: rgba(124, 58, 237, 0.2);
      color: #c4b5fd;
      border: 1px solid rgba(124, 58, 237, 0.4);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
    }

    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover { color: var(--text-main); }

    .tab-btn.active {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
    }

    main {
      max-width: 1240px;
      margin: 2.5rem auto 0 auto;
      padding: 0 2rem;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .tab-content.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .form-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
    }

    .submissions-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .submission-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 1.5rem;
      transition: border-color 0.2s;
    }

    .submission-item:hover {
      border-color: rgba(124, 58, 237, 0.45);
    }

    .submission-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .project-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .status-badge {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-accepted { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-rejected { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-processing { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }

    .submission-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .submission-links a {
      color: var(--secondary-accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(6, 182, 212, 0.08);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .submission-links a:hover { text-decoration: underline; }

    .scores-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 1rem 1.25rem;
      border-radius: 12px;
      margin-bottom: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .score-box { flex: 1; }

    .score-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .score-val {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary-accent);
    }

    .ai-meter-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
    }

    .ai-meter-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6 0%, #7c3aed 100%);
      border-radius: 10px;
    }

    .pros-cons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    @media (max-width: 768px) { .pros-cons-grid { grid-template-columns: 1fr; } }

    .pros-box {
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 10px;
      padding: 1rem;
    }

    .cons-box {
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 10px;
      padding: 1rem;
    }

    .box-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pros-box .box-title { color: var(--success); }
    .cons-box .box-title { color: var(--danger); }

    .point-list {
      padding-left: 1.2rem;
      font-size: 0.85rem;
      color: var(--text-main);
      line-height: 1.45;
    }

    .point-list li { margin-bottom: 4px; }

    .market-box {
      background: rgba(6, 182, 212, 0.06);
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .market-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--secondary-accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .market-desc {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .questions-box {
      background: rgba(124, 58, 237, 0.08);
      border: 1px dashed rgba(124, 58, 237, 0.35);
      padding: 1.25rem;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    .questions-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #c4b5fd;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .questions-list {
      padding-left: 1.2rem;
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    .questions-list li { margin-bottom: 6px; }

    .justification-box {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.02);
      padding: 1rem;
      border-radius: 8px;
      border-left: 3px solid var(--primary-accent);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .api-config-bar {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .api-config-bar input {
      padding: 4px 8px;
      font-size: 0.8rem;
      width: 200px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 24px;
      border-radius: 10px;
      background: #1e293b;
      color: white;
      border: 1px solid var(--border-card);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      z-index: 1000;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">
        <div class="brand-icon">ASC</div>
        <div>
          <div class="brand-title">AI Mentor Evaluation</div>
        </div>
        <span class="brand-tag">GitHub Pages</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="api-config-bar">
          <span>Backend URL:</span>
          <input type="text" id="apiBaseInput" placeholder="http://localhost:5000" onchange="saveApiBase()">
        </div>
        <div class="nav-tabs">
          <button class="tab-btn active" onclick="switchTab('judge')">🏆 Judge Portal</button>
          <button class="tab-btn" onclick="switchTab('submit')">📝 Pitch Submission</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- TAB 1: JUDGE PORTAL -->
    <div id="tab-judge" class="tab-content active">
      <div class="grid-2">
        <div class="glass-card">
          <div class="card-title">⚡ Create Hackathon Session</div>
          <form id="createHackathonForm" onsubmit="handleCreateHackathon(event)">
            <div class="form-group">
              <label>Hackathon Name</label>
              <input type="text" id="hackathonName" placeholder="e.g. Smart Education & Productivity Hackathon" required>
            </div>
            <div class="form-group">
              <label>Judge ID / Organization Email</label>
              <input type="text" id="judgeId" placeholder="e.g. mentor@hackathon.org" value="mentor@hackathon.org" required>
            </div>
            <div class="form-group">
              <label>Predefined Evaluation Criteria & Weightage</label>
              <textarea id="hackathonCriteria" rows="3" placeholder="Define rubrics: Innovation (40%), Real-World Market Impact (30%), Pitch & Code Execution (30%)..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Create Session</button>
          </form>
        </div>

        <div class="glass-card">
          <div class="card-title">📂 Active Hackathon Sessions</div>
          <div class="form-group">
            <label>Select Hackathon Session</label>
            <select id="hackathonSelect" onchange="loadSubmissions()"></select>
          </div>
          <div id="sessionMeta" style="margin-top: 1rem; font-size: 0.9rem; color: var(--text-muted);"></div>
        </div>
      </div>

      <div class="glass-card">
        <div class="card-title">📊 Evaluated Submissions & AI Reports</div>
        <div id="submissionsContainer" class="submissions-list">
          <div class="empty-state">Select or create a hackathon session above to view project submissions.</div>
        </div>
      </div>
    </div>

    <!-- TAB 2: PITCH SUBMISSION -->
    <div id="tab-submit" class="tab-content">
      <div class="glass-card" style="max-width: 720px; margin: 0 auto;">
        <div class="card-title">🚀 Submit Your Hackathon Pitch</div>
        <form id="submitProjectForm" onsubmit="handleProjectSubmit(event)">
          <div class="form-group">
            <label>Hackathon Session ID (Optional - auto-assigns general session if blank)</label>
            <input type="number" id="subHackathonId" placeholder="e.g. 1 (Leave empty for default session)" onblur="verifyHackathonId()">
            <small id="verifyStatus" style="display:block; margin-top:4px; font-size:0.8rem;"></small>
          </div>
          <div class="form-group">
            <label>Project Name / Team Name</label>
            <input type="text" id="subProjectName" placeholder="e.g. AI-Assisted Mentor Evaluation System - Team XYZ" required>
          </div>
          <div class="form-group">
            <label>GitHub Repository URL</label>
            <input type="url" id="subGithubLink" placeholder="https://github.com/username/project-repo" required>
          </div>
          <div class="form-group">
            <label>2-Minute Pitch Video URL (YouTube / Vimeo / MP4)</label>
            <input type="url" id="subVideoLink" placeholder="https://www.youtube.com/watch?v=..." required>
          </div>
          <div class="form-group">
            <label>PPT / Presentation Deck URL (Optional)</label>
            <input type="url" id="subPptLink" placeholder="https://docs.google.com/presentation/d/... or slide link">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1rem;">
            Submit Pitch & Deck for AI Evaluation
          </button>
        </form>
      </div>
    </div>
  </main>

  <div id="toast" class="toast">Action completed successfully</div>

  <script>
    function getApiBase() {
      const saved = localStorage.getItem('asc_api_base');
      if (saved) return saved;
      if (window.location.origin.includes('github.io')) {
        return 'https://asc-agent.onrender.com';
      }
      return window.location.origin;
    }

    function saveApiBase() {
      const val = document.getElementById('apiBaseInput').value.trim().replace(/\/+$/, '');
      if (val) {
        localStorage.setItem('asc_api_base', val);
        showToast(`API Server set to: ${val}`);
        fetchHackathons();
      }
    }

    document.getElementById('apiBaseInput').value = getApiBase();

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (tab === 'judge') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-judge').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-submit').classList.add('active');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function fetchHackathons() {
      const API_BASE = getApiBase();
      const judgeId = document.getElementById('judgeId').value || 'mentor@hackathon.org';
      try {
        const res = await fetch(`${API_BASE}/api/hackathons?judge_id=${encodeURIComponent(judgeId)}`);
        const hackathons = await res.json();
        
        const select = document.getElementById('hackathonSelect');
        select.innerHTML = '';
        if (!Array.isArray(hackathons) || hackathons.length === 0) {
          select.innerHTML = '<option value="">No hackathons created yet</option>';
          document.getElementById('submissionsContainer').innerHTML = '<div class="empty-state">No hackathons created yet. Create one on the left!</div>';
          return;
        }

        hackathons.forEach(h => {
          const opt = document.createElement('option');
          opt.value = h.id;
          opt.innerText = `#${h.id} - ${h.name}`;
          select.appendChild(opt);
        });

        loadSubmissions();
      } catch (err) {
        console.error('Failed to load hackathons:', err);
        document.getElementById('submissionsContainer').innerHTML = `<div class="empty-state">Could not connect to API server at <code>${getApiBase()}</code>. Start local agent server or check backend URL.</div>`;
      }
    }

    async function handleCreateHackathon(e) {
      e.preventDefault();
      const API_BASE = getApiBase();
      const name = document.getElementById('hackathonName').value;
      const judge_id = document.getElementById('judgeId').value;
      const criteria = document.getElementById('hackathonCriteria').value;

      try {
        const res = await fetch(`${API_BASE}/api/hackathons/create`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name, judge_id, criteria })
        });
        const data = await res.json();
        showToast(`Hackathon #${data.hackathon.id} Created Successfully!`);
        document.getElementById('hackathonName').value = '';
        fetchHackathons();
      } catch (err) {
        showToast('Error creating hackathon');
      }
    }

    async function loadSubmissions() {
      const API_BASE = getApiBase();
      const hackathonId = document.getElementById('hackathonSelect').value;
      if (!hackathonId) return;

      try {
        const res = await fetch(`${API_BASE}/api/dashboard/${hackathonId}`);
        const submissions = await res.json();
        
        const container = document.getElementById('submissionsContainer');
        if (!Array.isArray(submissions) || submissions.length === 0) {
          container.innerHTML = `<div class="empty-state">No submissions yet for Hackathon Session #${hackathonId}. Share Hack ID #${hackathonId} with participants!</div>`;
          return;
        }

        container.innerHTML = submissions.map(s => {
          let statusClass = 'status-processing';
          if (s.status === 'AI_ACCEPTED') statusClass = 'status-accepted';
          if (s.status === 'AI_REJECTED') statusClass = 'status-rejected';

          const posList = Array.isArray(s.positive_points) && s.positive_points.length > 0 
            ? s.positive_points.map(p => `<li>${escapeHtml(p)}</li>`).join('')
            : '<li>Standardized evaluation metrics satisfied</li>';

          const negList = Array.isArray(s.negative_points) && s.negative_points.length > 0 
            ? s.negative_points.map(p => `<li>${escapeHtml(p)}</li>`).join('')
            : '<li>Requires human mentor verification</li>';

          const questionsList = Array.isArray(s.mentor_questions) && s.mentor_questions.length > 0
            ? s.mentor_questions.map(q => `<li>${escapeHtml(q)}</li>`).join('')
            : '<li>What specific AI model / prompt architecture was used to analyze the pitch?</li>';

          const aiPct = typeof s.ai_generated_percentage === 'number' ? s.ai_generated_percentage : 25;

          return `
            <div class="submission-item">
              <div class="submission-header">
                <span class="project-name">${escapeHtml(s.project_name)}</span>
                <span class="status-badge ${statusClass}">${s.status.replace('_', ' ')}</span>
              </div>

              <div class="submission-links">
                <a href="${escapeHtml(s.github_link)}" target="_blank">📦 GitHub Repository</a>
                <a href="${escapeHtml(s.video_link)}" target="_blank">🎬 Pitch Video</a>
                ${s.ppt_link ? `<a href="${escapeHtml(s.ppt_link)}" target="_blank">📊 Pitch Deck PPT</a>` : ''}
              </div>

              <div class="scores-row">
                <div class="score-box">
                  <div class="score-label">Innovation Score</div>
                  <div class="score-val">${s.score_innovation ? s.score_innovation.toFixed(1) + ' / 10' : 'N/A'}</div>
                </div>
                <div class="score-box">
                  <div class="score-label">Impact Score</div>
                  <div class="score-val">${s.score_impact ? s.score_impact.toFixed(1) + ' / 10' : 'N/A'}</div>
                </div>
                <div class="score-box">
                  <div class="score-label">AI Code/Content %</div>
                  <div class="score-val" style="color: #60a5fa;">${aiPct}% AI</div>
                  <div class="ai-meter-container">
                    <div class="ai-meter-bar" style="width: ${Math.min(100, Math.max(0, aiPct))}%;"></div>
                  </div>
                </div>
              </div>

              <div class="pros-cons-grid">
                <div class="pros-box">
                  <div class="box-title">✅ Key Positive Points (Strengths)</div>
                  <ul class="point-list">${posList}</ul>
                </div>
                <div class="cons-box">
                  <div class="box-title">⚠️ Key Negative Points & Risks</div>
                  <ul class="point-list">${negList}</ul>
                </div>
              </div>

              <div class="market-box">
                <div class="market-title">🌐 Search Engine Real-World Necessity Validation:</div>
                <div class="market-desc">${escapeHtml(s.real_world_necessity || 'Search engine market research performed.')}</div>
              </div>

              <div class="questions-box">
                <div class="questions-title">❓ Suggested Questions for Judges Panel:</div>
                <ul class="questions-list">${questionsList}</ul>
              </div>

              <div class="justification-box">
                <strong>🤖 AI Evaluation Report Summary:</strong><br/>
                ${escapeHtml(s.justification || 'Evaluation report generated.')}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to load submissions:', err);
      }
    }

    async function verifyHackathonId() {
      const API_BASE = getApiBase();
      const id = document.getElementById('subHackathonId').value;
      const statusEl = document.getElementById('verifyStatus');
      if (!id) return;

      try {
        const res = await fetch(`${API_BASE}/api/hackathons/verify`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ hackathon_id: id })
        });
        const data = await res.json();
        if (data.valid) {
          statusEl.style.color = '#10b981';
          statusEl.innerText = `Session: ${data.hackathonName}`;
        } else {
          statusEl.style.color = '#ef4444';
          statusEl.innerText = 'Invalid Hackathon Session ID';
        }
      } catch (err) {
        statusEl.innerText = '';
      }
    }

    async function handleProjectSubmit(e) {
      e.preventDefault();
      const API_BASE = getApiBase();
      const hackathon_id = document.getElementById('subHackathonId').value;
      const project_name = document.getElementById('subProjectName').value;
      const github_link = document.getElementById('subGithubLink').value;
      const video_link = document.getElementById('subVideoLink').value;
      const ppt_link = document.getElementById('subPptLink').value;

      try {
        const res = await fetch(`${API_BASE}/submit`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ hackathon_id, project_name, github_link, video_link, ppt_link })
        });
        const data = await res.json();
        if (res.ok) {
          showToast('Project & PPT Submitted! AI Evaluation & Search Check Complete.');
          document.getElementById('submitProjectForm').reset();
          document.getElementById('verifyStatus').innerText = '';
          switchTab('judge');
          fetchHackathons();
        } else {
          showToast(data.error || 'Submission failed');
        }
      } catch (err) {
        showToast('Error submitting project');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    fetchHackathons();
  </script>
</body>
</html>
